# ==============================================================================
# InstituteHub Production Nginx Configuration
# Target Environment: Ubuntu Linux 22.04 / 24.04 LTS
# ==============================================================================

# Rate Limiting Zone: Mitigates DoS and scraping bursts
limit_req_zone $binary_remote_addr zone=institutehub_limit:10m rate=15r/s;

# Upstream / FastCGI / Server Blocks
# ------------------------------------------------------------------------------
# 1. HTTP Server Block: Mandatory 301 Redirect to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name institutehub.edu www.institutehub.edu;

    # Let's Encrypt ACME Challenge verification path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Permanent 301 Redirect for all other HTTP traffic
    location / {
        return 301 https://institutehub.edu$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Canonical www -> non-www HTTPS Redirect
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.institutehub.edu;

    ssl_certificate /etc/letsencrypt/live/institutehub.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/institutehub.edu/privkey.pem;

    return 301 https://institutehub.edu$request_uri;
}

# ------------------------------------------------------------------------------
# 3. Main HTTPS Production Server Block
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name institutehub.edu;

    root /var/www/institutehub/current/_site;
    index index.html index.htm;

    # Charset
    charset utf-8;

    # SSL / TLS Modern Cryptographic Configuration
    ssl_certificate /etc/letsencrypt/live/institutehub.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/institutehub.edu/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/institutehub.edu/chain.pem;

    # TLS Protocols (Enforce modern TLS 1.2 and TLS 1.3 only - legacy protocols disabled)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # TLS Session Optimization
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling (Validates certificate revocation with Zero DNS latency)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # Security Hardening Headers
    # --------------------------------------------------------------------------
    # HTTP Strict Transport Security (HSTS) - 2 Years with preload
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # Clickjacking defense
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # MIME-type sniffing defense
    add_header X-Content-Type-Options "nosniff" always;
    
    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy (CSP)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;
    
    # Permissions Policy
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    # --------------------------------------------------------------------------
    # Compression (Gzip & Static Pre-compression)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Logging Configuration
    # --------------------------------------------------------------------------
    access_log /var/log/nginx/institutehub_access.log combined buffer=64k flush=5m;
    error_log /var/log/nginx/institutehub_error.log warn;

    # --------------------------------------------------------------------------
    # Static Assets & Long-Term Caching
    # --------------------------------------------------------------------------
    # Cache CSS, JS, Images, and WebFonts for 1 year (Immutable)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Search JSON Endpoint (Revalidate on change)
    location = /search.json {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Sitemap and Robots
    location ~* (?:sitemap\.xml|robots\.txt)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # --------------------------------------------------------------------------
    # Root Routing & Clean URLs
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=institutehub_limit burst=25 nodelay;
        try_files $uri $uri/ $uri.html =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # --------------------------------------------------------------------------
    # Custom Error Pages & Maintenance Mode
    # --------------------------------------------------------------------------
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    error_page 503 @maintenance;
    location @maintenance {
        root /var/www/institutehub/current;
        rewrite ^(.*)$ /maintenance.html break;
    }

    # Block access to hidden files (.git, .env, .htaccess)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
