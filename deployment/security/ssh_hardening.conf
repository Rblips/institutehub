# ==============================================================================
# InstituteHub OpenSSH Server Hardening Configuration
# Destination: /etc/ssh/sshd_config.d/99-institutehub-hardening.conf
# ==============================================================================

# Network & Protocol
Port 22
AddressFamily inet
Protocol 2

# Authentication Hardening
PermitRootLogin no
PasswordAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys

# Session & Brute-Force Limits
MaxAuthTries 3
MaxSessions 4
LoginGraceTime 30s
ClientAliveInterval 300
ClientAliveCountMax 2

# Cryptographic Algorithm Restrictions (Modern Elliptic Curves & AES-GCM)
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# Feature Restrictions
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitUserEnvironment no

# Logging & Auditing
LogLevel VERBOSE
SyslogFacility AUTH
