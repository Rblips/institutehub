name: InstituteHub CD Deployment

on:
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-production:
    name: Production Server Deployment
    runs-on: ubuntu-22.04
    environment: production

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Ruby 3.2
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Production Jekyll Site
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --strict

      - name: Pre-Deployment Validation
        run: |
          python scripts/deployment_check.py --root .

      - name: Configure SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.PROD_SERVER_HOST }}
          SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SERVER_HOST" ]; then
            echo "[!] Secrets PROD_SSH_PRIVATE_KEY or PROD_SERVER_HOST not configured. Simulating deployment dry-run."
            echo "DEPLOY_SIMULATION=true" >> $GITHUB_ENV
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy Atomic Release to Ubuntu Host
        if: env.DEPLOY_SIMULATION != 'true'
        env:
          SERVER_HOST: ${{ secrets.PROD_SERVER_HOST }}
          SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
        run: |
          RELEASE_TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          RELEASE_DIR="/var/www/institutehub/releases/$RELEASE_TIMESTAMP"

          echo "[*] Syncing built release to $RELEASE_DIR..."
          ssh -i ~/.ssh/deploy_key $SERVER_USER@$SERVER_HOST "mkdir -p $RELEASE_DIR"
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" ./ $SERVER_USER@$SERVER_HOST:$RELEASE_DIR/

          echo "[*] Updating atomic symlink to current..."
          ssh -i ~/.ssh/deploy_key $SERVER_USER@$SERVER_HOST "
            ln -sfn $RELEASE_DIR /var/www/institutehub/current && \
            sudo systemctl reload nginx
          "

      - name: Post-Deployment Health Check
        run: |
          python scripts/health_check.py --url https://institutehub.edu || echo "Health check returned warning (DNS/Cert pending)"
