name: InstituteHub CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Ruby 3.2
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Validate Jekyll Build
        run: |
          bundle exec jekyll build --strict --trace

      - name: Run Pre-Flight Deployment Validator
        run: |
          python scripts/deployment_check.py --root .

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Local Health & Backup Checks
        run: |
          python scripts/health_check.py --local-only
          python scripts/backup.py --dry-run
          python scripts/cleanup.py --dry-run
