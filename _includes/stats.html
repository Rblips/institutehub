<section class="stats-bar" aria-label="Institutional Key Statistics">
  <div class="container">
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-number">{{ site.stats.years_excellence }}</div>
        <div class="stat-label">Years of Excellence</div>
      </div>
      <div class="stat-item">
        <div class="stat-number">{{ site.stats.faculty_count }}</div>
        <div class="stat-label">Distinguished Faculty</div>
      </div>
      <div class="stat-item">
        <div class="stat-number">{{ site.stats.research_labs }}</div>
        <div class="stat-label">Advanced Research Labs</div>
      </div>
      <div class="stat-item">
        <div class="stat-number">{{ site.stats.student_count }}</div>
        <div class="stat-label">Scholars & Engineers</div>
      </div>
    </div>
  </div>
</section>
